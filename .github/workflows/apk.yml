name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk yt-mobile.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YT Mobile 1.0.${{ github.run_number }}
          make_latest: true
          files: yt-mobile.apk
          body: |
            Toca em **yt-mobile.apk** aqui embaixo pra baixar e instalar.
